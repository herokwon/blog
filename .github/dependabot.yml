version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: release/v0.1.0
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [patch]
      actions-minor:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor]

  - package-ecosystem: npm
    directory: /
    target-branch: release/v0.1.0
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: svelte
        update-types: [version-update:semver-major]
      - dependency-name: '@sveltejs/*'
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: '@tailwindcss/*'
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/*'
        update-types: [version-update:semver-major]
      - dependency-name: prettier
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: wrangler
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: '@vitest/*'
        update-types: [version-update:semver-major]
      - dependency-name: playwright
        update-types: [version-update:semver-major]
      - dependency-name: '@playwright/*'
        update-types: [version-update:semver-major]
    groups:
      npm-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [patch]
      npm-minor:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor]
