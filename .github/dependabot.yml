version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      production-deps:
        dependency-type: production
        patterns: ['*']
        update-types: [patch]
      development-deps:
        dependency-type: development
        patterns: ['*']
        exclude-patterns: ['drizzle-*']
        update-types: [minor, patch]
