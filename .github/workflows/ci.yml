name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-env
        with:
          enable-cache: true
      - run: pnpm lint

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-env
        with:
          enable-cache: true
      - run: pnpm check
      - name: Checkout release PR head
        if: >-
          github.event.pull_request.base.ref == 'main' &&
          startsWith(github.event.pull_request.head.ref, 'release/')
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: release-head
          persist-credentials: false
      - name: Check release package version
        if: >-
          github.event.pull_request.base.ref == 'main' &&
          startsWith(github.event.pull_request.head.ref, 'release/')
        env:
          RELEASE_REF: ${{ github.event.pull_request.head.ref }}
        run: node .github/scripts/release-version.ts check "$RELEASE_REF" release-head/package.json

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-env
        with:
          enable-cache: true
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-env
        with:
          enable-cache: true
      - run: pnpm build
