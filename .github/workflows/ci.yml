name: ✅ CI
on:
  pull_request:
    branches: [main, 'release/*']
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, 'release/*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run check:automation
      - run: pnpm run test:automation

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:coverage
      - run: pnpm run test:e2e
      - name: Summarize tests
        if: always()
        run: node scripts/automation/test-summary.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/
            test-results/
          retention-days: 14
          if-no-files-found: warn

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: 'false'
          cache: 'false'
      - run: node scripts/automation/audit.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/audit.json
          retention-days: 14

  release-version:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { checkVersion } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/automation/github.ts`);
            await checkVersion({ github, context, core });

  ci:
    if: always()
    needs: [quality, tests, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const jobs = JSON.parse(process.env.RESULTS);
            for (const [name, job] of Object.entries(jobs)) {
              console.log(`${name}: ${job.result}`);
              if (job.result !== "success") process.exitCode = 1;
            }
          '
