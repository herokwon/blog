name: ✅ CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Lint
        run: pnpm lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Generate Worker Types
        run: pnpm gen

      - name: Check Types
        run: pnpm check

  test:
    name: Test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Generate Worker Types
        run: pnpm gen

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Test
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Generate Worker Types
        run: pnpm gen

      - name: Run Build
        run: pnpm build
