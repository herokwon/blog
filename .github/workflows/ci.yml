name: ✅ CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && (github.event.pull_request.state == 'open' && !github.event.pull_request.draft) && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || (github.event.pull_request.state == 'open' && !github.event.pull_request.draft)
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Run Lint
        run: pnpm lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || (github.event.pull_request.state == 'open' && !github.event.pull_request.draft)
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Check Types
        run: pnpm check

  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || (github.event.pull_request.state == 'open' && !github.event.pull_request.draft)
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Run Build
        run: pnpm build
      - name: Share Build Output
        uses: actions/upload-artifact@v7
        with:
          name: worker-build
          overwrite: true
          path: .svelte-kit/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || (github.event.pull_request.state == 'open' && !github.event.pull_request.draft)
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Restore Build Output
        uses: actions/download-artifact@v8
        with:
          name: worker-build
          path: .svelte-kit/
      - name: Install Playwright Browser
        run: pnpm exec playwright install chromium --with-deps
      - name: Run Tests
        run: pnpm test
      - name: Keep Playwright Failure Evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure
          path: playwright-report/
          if-no-files-found: ignore
