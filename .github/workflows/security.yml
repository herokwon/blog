name: 🔒 Scheduled security
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: targets
        with:
          script: |
            const { scheduledTargets } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/automation/github.ts`);
            await scheduledTargets({ github, context, core });
  audit:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
          path: target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: automation
      - uses: herokwon/blog/.github/actions/setup@91cacfb599514d797def0dee82788b9af8cf37e9
        with:
          install: 'false'
          cache: 'false'
          working-directory: target
      - name: Audit target lockfile
        working-directory: target
        env:
          AUDIT_BRANCH: ${{ matrix.branch }}
          AUDIT_SHA: ${{ matrix.sha }}
          AUDIT_EXCEPTIONS_FILE: ../automation/.github/audit-exceptions.json
        run: |
          printf '## %s\nSHA: %s\n' "$AUDIT_BRANCH" "$AUDIT_SHA" >> "$GITHUB_STEP_SUMMARY"
          node ../automation/scripts/automation/audit.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scheduled-audit-${{ matrix.sha }}-${{ github.run_attempt }}
          path: target/test-results/audit.json
          retention-days: 14
