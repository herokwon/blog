name: Version Bump
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: version-bump-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false
jobs:
  guard:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!/^release\/(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(pr.head.ref)) throw new Error('Invalid release branch');
            const { data } = await github.rest.repos.getBranch({ ...context.repo, branch: pr.head.ref });
            if (!data.protected || data.commit.sha !== pr.head.sha) throw new Error('Only the current protected release head may prepare a version');
  bump:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Privileged execution uses default-branch code only, never PR-controlled code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const { bump } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/automation/github.ts`);
            await bump({ github, context, core });
